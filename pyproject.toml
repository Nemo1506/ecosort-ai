[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length (handled by visual wrapping)
    "E402",  # module level import not at top of file (common in scripts with sys.path)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
